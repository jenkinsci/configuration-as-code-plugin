items:
  - freestyle:
      name: "example-freestyle-project"
      displayName: "Example Freestyle Project"
      description: "A sample Freestyle project configured directly via JCasC"

      concurrentBuild: true
      quietPeriod: 30

      properties:
        - githubProjectProperty:
            projectUrlStr: "https://github.com/jenkinsci/configuration-as-code-plugin/"

      triggers:
        - cron:
            spec: "@daily"

      buildWrappers:
        - timestamps

      builders:
        - shell:
            command: "echo 'Building the freestyle project!'"

      publishers:
        - mailer:
            recipients: "admin@example.com"
            notifyEveryUnstableBuild: true
            sendToIndividuals: false
