items:
  - folder:
      name: "secure-folder"
      properties:
        - folderCredentialsProperty:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: SYSTEM
                      id: "folder-secret-id"
                      username: "my-user"
                      password: "my-password"
                      description: "A secret for this folder"
